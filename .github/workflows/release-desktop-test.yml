name: Release Desktop Test

on:
  push:
    tags:
      - "desktop-test-v*"
  workflow_dispatch:
    inputs:
      codeup_ref:
        description: "Codeup ref to build"
        required: false
        default: "main"

permissions:
  contents: read

env:
  CODEUP_REPOSITORY: ethan@codeup:codeup/job-hunter.git

jobs:
  windows_release_test:
    name: Windows desktop release test
    runs-on: windows-latest
    steps:
      - name: Configure Codeup SSH
        shell: bash
        env:
          CODEUP_SSH_PRIVATE_KEY_B64: ${{ secrets.CODEUP_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$CODEUP_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/codeup
          chmod 600 ~/.ssh/codeup
          ssh-keyscan -t rsa,ed25519 ethan-cn-shenzhen.devops.aliyuncs.com >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host codeup
            HostName ethan-cn-shenzhen.devops.aliyuncs.com
            User ethan
            IdentityFile $HOME/.ssh/codeup
            IdentitiesOnly yes
            PubkeyAcceptedAlgorithms +ssh-rsa
            PubkeyAcceptedKeyTypes +ssh-rsa
            HostkeyAlgorithms +ssh-rsa
          EOF

      - name: Clone Codeup source
        shell: bash
        run: |
          set -euo pipefail
          git clone "$CODEUP_REPOSITORY" source
          cd source
          git fetch --tags origin
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            if git rev-parse -q --verify "refs/tags/${GITHUB_REF_NAME}" >/dev/null; then
              git checkout "${GITHUB_REF_NAME}"
            else
              echo "Codeup tag ${GITHUB_REF_NAME} does not exist."
              exit 1
            fi
          else
            git checkout "${{ inputs.codeup_ref }}"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: pwsh
        working-directory: source
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm install --no-frozen-lockfile

      - name: Build Windows installer and portable package
        shell: pwsh
        working-directory: source
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm.cmd --prefix desktop run tauri:build -- --bundles nsis
          cargo build --release --manifest-path desktop/src-tauri/Cargo.toml --bin job_tool --target-dir .codex-cargo-target/desktop-tauri
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $dist = "dist-release"
          $stage = Join-Path $dist "Career Harbor $version x64 test"
          $zip = Join-Path $dist "Career.Harbor_${version}_${env:GITHUB_REF_NAME}_x64_portable_test.zip"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath ".codex-cargo-target/desktop-tauri/release/job-tool-desktop.exe" -Destination (Join-Path $stage "Career Harbor.exe") -Force
          Copy-Item -LiteralPath ".codex-cargo-target/desktop-tauri/release/job_tool.exe" -Destination (Join-Path $stage "career-harbor-cli.exe") -Force
          Copy-Item -LiteralPath ".codex-cargo-target/desktop-tauri/release/job_tool.exe" -Destination (Join-Path $stage "career-harbor-helper.exe") -Force
          $llamaStage = Join-Path $stage "llama"
          $llamaTemp = Join-Path $env:RUNNER_TEMP "llama"
          New-Item -ItemType Directory -Force -Path $llamaStage,$llamaTemp,(Join-Path $llamaStage "models") | Out-Null
          $llamaZip = Join-Path $llamaTemp "llama-win-vulkan.zip"
          curl.exe -L --fail --retry 3 -o $llamaZip "https://github.com/ggml-org/llama.cpp/releases/download/b9967/llama-b9967-bin-win-vulkan-x64.zip"
          Expand-Archive -LiteralPath $llamaZip -DestinationPath $llamaStage -Force
          @"
          Career Harbor local AI model

          Download URL:
          https://download.o2dream.cc/career-harbor/models/Qwen3-1.7B-Q8_0.gguf

          Save as:
          llama/models/Qwen3-1.7B-Q8_0.gguf

          SHA256:
          061b54daade076b5d3362dac252678d17da8c68f07560be70818cace6590cb1a
          "@ | Set-Content -Encoding UTF8 (Join-Path $llamaStage "MODEL_DOWNLOAD.txt")
          Compress-Archive -LiteralPath $stage -DestinationPath $zip -Force
          New-Item -ItemType Directory -Force -Path "desktop/release-test-assets" | Out-Null
          Copy-Item "desktop/src-tauri/target/release/bundle/nsis/*" "desktop/release-test-assets/" -Force -ErrorAction SilentlyContinue
          Copy-Item ".codex-cargo-target/desktop-tauri/release/bundle/nsis/*" "desktop/release-test-assets/" -Force -ErrorAction SilentlyContinue
          Copy-Item "dist-release/*_test.zip" "desktop/release-test-assets/" -Force

      - name: Smoke test portable desktop app
        shell: pwsh
        working-directory: source
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $exe = Join-Path "dist-release" "Career Harbor $version x64 test/Career Harbor.exe"
          if (!(Test-Path $exe)) {
            throw "Portable desktop executable was not created: $exe"
          }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            throw "Portable desktop executable exited during startup smoke test with code $($process.ExitCode)."
          }
          $assetDir = (Resolve-Path "desktop/release-test-assets").Path
          $recording = Join-Path $assetDir "desktop-startup-smoke.mp4"
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            ffmpeg -y -f gdigrab -framerate 10 -i desktop -t 15 -pix_fmt yuv420p $recording
            if (!(Test-Path $recording)) {
              throw "Desktop startup recording was not created."
            }
          } else {
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $screenshot = Join-Path $assetDir "desktop-startup-smoke.png"
            $bitmap.Save($screenshot, [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose()
            $bitmap.Dispose()
            if (!(Test-Path $screenshot)) {
              throw "Desktop startup screenshot was not created."
            }
          }
          Stop-Process -Id $process.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-test-assets
          path: ${{ github.workspace }}/**/release-test-assets/*
          if-no-files-found: error
          retention-days: 1
